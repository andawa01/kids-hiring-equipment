name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.17.6"
      - name: Ruff
        run: ruff check .

  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: partyplay
          POSTGRES_PASSWORD: partyplay
          POSTGRES_DB: partyplay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partyplay -d partyplay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://partyplay:partyplay@localhost:5432/partyplay_test
      TEST_DATABASE_URL: postgresql+psycopg://partyplay:partyplay@localhost:5432/partyplay_test
      JWT_SECRET: ci-only-secret-do-not-use-in-production-0123456789
      COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check model/migration drift
        run: alembic check

      - name: Run tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit in the PR/push.
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
